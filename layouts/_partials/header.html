<header class="site-header">
  <div class="container header-inner">
    <a href="{{ "/" | relURL }}" class="brand">
      {{ partial "mark.html" . }}
      <span>EXALYNT</span>
      <span class="brand-tag">Blog</span>
    </a>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
      {{ with .Site.Params.siteURL }}
        <a href="{{ . }}">Exalynt.com</a>
      {{ end }}
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
        {{ partial "icons.html" "moon" }}
        {{ partial "icons.html" "sun" }}
      </button>
    </nav>
  </div>
</header>
